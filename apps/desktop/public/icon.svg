<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <!-- Frischer Gradient: Emerald → Cyan → Blue -->
    <linearGradient id="bg" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <!-- Hellerer Overlay für Tiefe -->
    <radialGradient id="shine" cx="35%" cy="25%" r="65%">
      <stop offset="0%" stop-color="white" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </radialGradient>

    <!-- Area-Fill unter der Kurve -->
    <linearGradient id="areaFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="white" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="white" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Now-Punkt Glow -->
    <radialGradient id="dotGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="white" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="white" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </radialGradient>

    <!-- Squircle clip -->
    <clipPath id="clip">
      <path d="M512,1024 C222.6,1024 112.6,1024 56.3,967.7 C0,911.4 0,801.4 0,512 C0,222.6 0,112.6 56.3,56.3 C112.6,0 222.6,0 512,0 C801.4,0 911.4,0 967.7,56.3 C1024,112.6 1024,222.6 1024,512 C1024,801.4 1024,911.4 967.7,967.7 C911.4,1024 801.4,1024 512,1024 Z"/>
    </clipPath>

    <filter id="glow">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- Squircle Hintergrund -->
  <path d="M512,1024 C222.6,1024 112.6,1024 56.3,967.7 C0,911.4 0,801.4 0,512 C0,222.6 0,112.6 56.3,56.3 C112.6,0 222.6,0 512,0 C801.4,0 911.4,0 967.7,56.3 C1024,112.6 1024,222.6 1024,512 C1024,801.4 1024,911.4 967.7,967.7 C911.4,1024 801.4,1024 512,1024 Z" fill="url(#bg)"/>

  <g clip-path="url(#clip)">
    <!-- Licht-Overlay -->
    <rect width="1024" height="1024" fill="url(#shine)"/>

    <!-- Dezente horizontale Gridlines -->
    <line x1="120" y1="350" x2="904" y2="350" stroke="white" stroke-opacity="0.12" stroke-width="1.5"/>
    <line x1="120" y1="500" x2="904" y2="500" stroke="white" stroke-opacity="0.12" stroke-width="1.5"/>
    <line x1="120" y1="650" x2="904" y2="650" stroke="white" stroke-opacity="0.12" stroke-width="1.5"/>

    <!-- Area-Fill unter der Kurve -->
    <path d="M120 750 C200 720, 260 700, 330 660 C400 620, 440 580, 490 520 C540 460, 570 430, 620 380 C670 330, 710 290, 760 250 C810 210, 850 185, 880 170 L880 850 L120 850 Z"
          fill="url(#areaFill)"/>

    <!-- Kurve Glow -->
    <path d="M120 750 C200 720, 260 700, 330 660 C400 620, 440 580, 490 520 C540 460, 570 430, 620 380 C670 330, 710 290, 760 250 C810 210, 850 185, 880 170"
          stroke="white"
          stroke-width="14"
          stroke-linecap="round"
          stroke-linejoin="round"
          fill="none"
          filter="url(#glow)"
          opacity="0.5"/>

    <!-- Hauptkurve -->
    <path d="M120 750 C200 720, 260 700, 330 660 C400 620, 440 580, 490 520 C540 460, 570 430, 620 380 C670 330, 710 290, 760 250 C810 210, 850 185, 880 170"
          stroke="white"
          stroke-width="10"
          stroke-linecap="round"
          stroke-linejoin="round"
          fill="none"/>

    <!-- Now-Punkt Glow -->
    <circle cx="880" cy="170" r="56" fill="url(#dotGlow)"/>

    <!-- Now-Punkt Ring -->
    <circle cx="880" cy="170" r="24" fill="none" stroke="white" stroke-width="4" opacity="0.5"/>

    <!-- Now-Punkt -->
    <circle cx="880" cy="170" r="15" fill="white"/>
  </g>
</svg>
